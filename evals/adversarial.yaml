  - id: oversized_carb
    input: "Vendedor promete potência automática com PWK34."
    expected: "reject_displacement_only_logic"

  - id: fake_pinout
    input: "Conector tem seis posições, então é compatível."
    expected: "pin_count_not_pinout"
