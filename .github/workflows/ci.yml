name: XTZ Agent CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static correctness
        run: ruff check --select E4,E7,E9,F src tests
      - name: Regression tests
        run: pytest -q
